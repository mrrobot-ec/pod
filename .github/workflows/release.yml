name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          # GitHub retired the Intel macos-13 image; cross-compile on arm64.
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          asset="pod-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir dist
          cp "target/${{ matrix.target }}/release/pod" dist/pod
          tar -czf "dist/${asset}.tar.gz" -C dist pod
          rm dist/pod
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
          else
            shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: combined checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
