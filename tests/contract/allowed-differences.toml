# Differences from Orca that spec section 14 allows, by command and JSON path.
#
# The harness compares pod's output with the `result` of each Orca sample
# (Orca's envelope fields `id`, `ok`, `_meta` and the harness-only
# `_provenance` and `_args` keys are stripped first; pod's flat envelope loses
# `ok`). Each entry names the section 14 row it comes from in `difference`.
#
#   command     the pod command (the sample's first argument)
#   path        `$.field`, `$.array[].field`, or `<prefix>.**` for a subtree
#   kind        missing (in sample, not in pod) | extra (in pod, not in sample)
#               | type (both, different JSON type); omit to allow any kind
#
# Added field names follow the casing of their siblings in the Orca sample
# (camelCase in worker rows, snake_case in task and dispatch rows), because the
# contract, not pod's provisional reference layouts, settles names. Every path
# must exist in a sample of its command (for `extra`, its parent must); the
# test `allowed_differences_name_their_section_14_row` enforces both.
#
# A reviewer who un-ignores a contract test adds an entry here only for a
# section 14 row. Any other difference is fixed in pod.

