[package]
name = "pod"
version = "0.2.11"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Supervised multi-agent orchestration for herdr, as a herdr plugin"
repository = "https://github.com/mrrobot-ec/pod"
readme = "README.md"

[features]
default = []
fake-herdr = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Turns on `fake-herdr` for every test build (lib, bin, and integration
# tests), so `cargo test` needs no flags and release builds never contain it.
pod = { path = ".", features = ["fake-herdr"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = { version = "0.5", default-features = false }
# Only `setsid` in one identity test, so a stranger process shares no terminal.
libc = "0.2"
jsonschema = { version = "0.28", default-features = false }

[[bin]]
name = "pod"
path = "src/main.rs"

[[bench]]
name = "commands"
harness = false
# `cargo test` (CI) runs it once in criterion's test mode, which asserts the
# spec section 16 targets before any sampling.
test = true
